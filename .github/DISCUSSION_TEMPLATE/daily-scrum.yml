        - 오늘 마무리한 일:
        - 추후 진행할 일:
    validations:
      required: false

  - type: textarea
    id: scrum-bae-jeonghyeon
    attributes:
      label: 👤 배정현 (DBA)
      value: |
        - 오늘 할 일:
        - 오늘 마무리한 일:
        - 추후 진행할 일:
    validations:
      required: false

  - type: textarea
    id: scrum-seo-minji
    attributes:
      label: 👤 서민지 (FE-PM)
      value: |
        - 오늘 할 일:
        - 오늘 마무리한 일:
        - 추후 진행할 일:
