    validations:
      required: false

  - type: textarea
    id: notice
    attributes:
      label: 📢 공지 사항
      placeholder: 팀 전체 공지 사항을 작성해주세요.
    validations:
      required: false

  - type: textarea
    id: remarks
    attributes:
      label: ⚠️ 특이 사항
      placeholder: 블로커, 이슈 등 공유가 필요한 특이 사항을 작성해주세요.
    validations:
      required: false
