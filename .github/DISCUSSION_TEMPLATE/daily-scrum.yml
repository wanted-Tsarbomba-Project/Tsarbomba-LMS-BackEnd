title: "[데일리 스크럼] "

body:
  - type: markdown
    attributes:
      value: |
        ## 📅 데일리 스크럼
        각자 본인 항목에 `오늘 할 일 / 오늘 마무리한 일 / 추후 진행할 일` 을 작성해주세요.

  - type: textarea
    id: scrum-kim-donghoon
    attributes:
      label: 👤 김동훈 (PO)
      value: |
        - 오늘 할 일:
        - 오늘 마무리한 일:
        - 추후 진행할 일:
    validations:
      required: false

  - type: textarea
    id: scrum-kim-donghyun
    attributes:
      label: 👤 김동현 (BE-PM)
      value: |
        - 오늘 할 일:
        - 오늘 마무리한 일:
        - 추후 진행할 일:
    validations:
      required: false

  - type: textarea
    id: scrum-lee-ganguk
    attributes:
      label: 👤 이강욱 (BE-DevOps)
      value: |
        - 오늘 할 일:
