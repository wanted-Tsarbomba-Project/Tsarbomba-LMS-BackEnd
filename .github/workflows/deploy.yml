name: Deploy Spring (② EC2)

on:
  push:
    branches: [main]            # develop→main 머지(=릴리스) 시 배포
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'Dockerfile'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 동시 배포 방지
concurrency:
  group: deploy-spring-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPO: team05/backend
  S3_PREFIX: s3://team05-01-deploy-0708-635249349258-ap-northeast-2-an/spring/
  EC2_NAME_TAG: team05-01-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write             # OIDC 토큰 발급(키리스 핵심)
      contents: read
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: AWS 자격증명 (OIDC, team05-github-actions)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::635249349258:role/team05-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드 & ECR 푸시
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$REGISTRY/$ECR_REPO:$TAG" -t "$REGISTRY/$ECR_REPO:latest" .
          docker push "$REGISTRY/$ECR_REPO:$TAG"
          docker push "$REGISTRY/$ECR_REPO:latest"

      - name: .env 조립 (GitHub Secrets/Variables → 파일, 값은 로그 마스킹)
        # 시크릿을 SSM 명령 텍스트에 넣지 않기 위해 러너에서 파일로 만들어 S3로만 전달
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          SPRING_PROFILES_ACTIVE: deploy
          GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/gcp-storage-key.json
          DDL_AUTO: ${{ vars.DDL_AUTO }}
          DB_URL: ${{ vars.DB_URL }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          LOKI_HOST: ${{ vars.LOKI_HOST }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          FASTAPI_URL: ${{ vars.FASTAPI_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_USERNAME: ${{ vars.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI }}
          OAUTH_ADDITIONAL_INFO_URI: ${{ vars.OAUTH_ADDITIONAL_INFO_URI }}
          OAUTH_SUCCESS_URI: ${{ vars.OAUTH_SUCCESS_URI }}
          OAUTH_ERROR_URI: ${{ vars.OAUTH_ERROR_URI }}
          COOKIE_SECURE: ${{ vars.COOKIE_SECURE }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_STORAGE_BUCKET: ${{ vars.GCP_STORAGE_BUCKET }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          umask 077
          # ── 필수 값 검증 (재발방지 가드) ──
          # 누락 시 앱이 application.yml의 localhost/빈 기본값으로 "조용히" 떨어져
          # 챗봇(FASTAPI_URL)·로그수집(LOKI_HOST)·OAuth 리다이렉트가 런타임에 깨진다.
          # → 배포 자체를 여기서 크게 실패시켜 잘못된 기동을 막는다.
          missing=""
          for k in DB_URL DB_USERNAME DB_PASSWORD JWT_SECRET REDIS_HOST REDIS_PASSWORD \
                   FASTAPI_URL LOKI_HOST CORS_ALLOWED_ORIGINS COOKIE_SECURE \
                   GOOGLE_REDIRECT_URI OAUTH_SUCCESS_URI OAUTH_ADDITIONAL_INFO_URI OAUTH_ERROR_URI; do
            [ -z "${!k:-}" ] && missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "❌ 필수 GitHub Secret/Variable 누락:$missing"
            echo "   → 레포 Settings → Secrets and variables → Actions 에 등록 후 재실행."
            exit 1
          fi
          : > deploy.env
          # 빈 값은 건너뜀 → application.yml 기본값 유지 (빈값 override 방지)
          for k in ECR_REGISTRY SPRING_PROFILES_ACTIVE GOOGLE_APPLICATION_CREDENTIALS DDL_AUTO \
                   DB_URL DB_USERNAME DB_PASSWORD REDIS_HOST REDIS_PORT REDIS_PASSWORD LOKI_HOST \
                   CORS_ALLOWED_ORIGINS FASTAPI_URL JWT_SECRET MAIL_USERNAME MAIL_PASSWORD \
                   GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URI \
                   OAUTH_ADDITIONAL_INFO_URI OAUTH_SUCCESS_URI OAUTH_ERROR_URI COOKIE_SECURE \
                   GCP_PROJECT_ID GCP_STORAGE_BUCKET; do
            v="${!k}"
            [ -n "$v" ] && printf '%s=%s\n' "$k" "$v" >> deploy.env
          done
          mkdir -p keyout
          printf '%s' "$GCP_SA_KEY" > keyout/gcp-storage-key.json

      - name: 배포자산 + .env + GCP키 S3 업로드 (SSE)
        run: |
          set -euo pipefail
          aws s3 sync deploy/ "$S3_PREFIX" --exclude '.env.example'
          aws s3 cp deploy.env "${S3_PREFIX}.env" --sse AES256
          aws s3 cp keyout/gcp-storage-key.json "${S3_PREFIX}secrets/gcp-storage-key.json" --sse AES256

      - name: ② EC2에서 받아 기동 (SSM send-command — 시크릿 없음)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$EC2_NAME_TAG" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          echo "대상 인스턴스: $INSTANCE_ID"
          if [ -z "$INSTANCE_ID" ]; then echo "running 인스턴스 없음"; exit 1; fi

          # EC2 명령: S3에서 .env·키·compose 받기 → ECR 로그인 → compose pull/up → 헬스체크
          # (ECR 레지스트리 URL은 비밀 아님 → 명령에 넣어도 무방. 실제 시크릿은 S3의 .env에만)
          cat > params.json <<EOF
          {"commands":[
            "set -e",
            "export ECR_REGISTRY=$REGISTRY",
            "mkdir -p /opt/spring/secrets",
            "aws s3 sync $S3_PREFIX /opt/spring",
            "cd /opt/spring",
            "chmod 600 .env secrets/gcp-storage-key.json 2>/dev/null || true",
            "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY",
            "docker compose pull",
            "docker compose up -d",
            "echo '헬스 체크: localhost:8080/actuator/health 대기...'",
            "for i in \$(seq 1 40); do curl -fs -o /dev/null http://localhost:8080/actuator/health && { echo 'OK: health UP'; break; }; [ \$i -eq 40 ] && { echo 'FAIL: 200초 후에도 비정상'; docker compose logs --tail 80 spring; exit 1; }; sleep 5; done",
            "docker image prune -f"
          ]}
          EOF

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy spring ${{ github.sha }}" \
            --timeout-seconds 600 \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)
          echo "CommandId: $CMD_ID"

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          echo "===== EC2 표준 출력 ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          echo "최종 상태: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "===== EC2 표준 에러 ====="
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" --output text
            exit 1
          fi

      - name: S3 시크릿 정리 (at-rest 제거)
        if: always()
        run: |
          aws s3 rm "${S3_PREFIX}.env" || true
          aws s3 rm "${S3_PREFIX}secrets/gcp-storage-key.json" || true
